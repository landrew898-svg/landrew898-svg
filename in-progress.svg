<text x="28" y="39" fill="#52e0ca" font-size="12" font-weight="400" font-family="Consolas,monospace" >● BUILDING</text><text x="28" y="80" fill="#e6eefb" font-size="22" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >Automated penetration testing &amp; remediation</text><text x="28" y="115" fill="#a4b3c9" font-size="17" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >Leading documentation and testing for a team capstone using</text><text x="28" y="140" fill="#a4b3c9" font-size="17" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >Java, MCP, and a Dockerized lab.</text><path d="M28 171H772" stroke="#243147"/><text x="28" y="213" fill="#e6eefb" font-size="23" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >AI Car Companion</text><text x="28" y="249" fill="#a4b3c9" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >Prototyping a compact AI passenger with a personality. Exploring local</text><text x="28" y="274" fill="#a4b3c9" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >language models in LM Studio, conversational responses, and a</text><text x="28" y="299" fill="#a4b3c9" font-size="16" font-weight="400" font-family="Segoe UI,Arial,sans-serif" >dedicated device interface.</text><text x="28" y="338" fill="#67abff" font-size="13" font-weight="400" font-family="Consolas,monospace" >Local AI experiments · Personality testing · Device design</text>
